      - step: 1
        label: "Blank Preparation"
        output: generic-turning/step-01.jpg
        status: pending
        prompt: >
          Close-up macro photograph on a pine workbench: a rough bandsaw-cut bowl
          blank of walnut, approximately 8 inches diameter and 4 inches thick,

          side-raking light, mid dof f/5.6, intimate-craft mood
      - step: 3
        label: "Rough Turning Exterior"
        output: generic-turning/step-03.jpg
        status: pending
        prompt: >
          45-degree three-quarter view of a bowl blank being rough-turned on the

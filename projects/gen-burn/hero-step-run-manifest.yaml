      dof: shallow
      background: "workshop bench raw pine"
      mood: intimate-craft
    hero_prompts:
      - id: H1
        label: "Walnut Bowl, Finish Turned, Side-Raking Light"
        output: generic-turning/hero-H1.jpg
        status: pending
        prompt: >
          Product photograph of a hand-turned walnut bowl on a worn pine workbench,
          freshly finish-turned with tool marks still faintly visible on the interior,
          dramatic raking side light from the left casting long shadows that reveal
          the end-grain figure, shallow depth of field with the rim sharp and the
          interior falling into soft bokeh, warm amber tones, 45-degree three-quarter
          view, mood: intimate workshop craft, no props
      - id: H2
        label: "Maple Vase, Wax-Buffed Final Finish, Overhead"
        output: generic-turning/hero-H2.jpg
        status: pending
        prompt: >
          Flat-lay overhead photograph of a tall maple vase form, freshly hand-turned

          grain with faint curly figure, deep depth of field f/11, clean
          minimal-gallery mood, centered composition with subtle drop shadow
      - id: H3
        label: "Cherry Platter, Danish Oil Stage, Natural Window Light"
        output: generic-turning/hero-H3.jpg
        status: pending
        prompt: >
          45-degree three-quarter view of a wide cherry platter resting on a linen
